<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIRMAN</title>
</head>
<body>
    <h2>NIRMAN - Floor Plan Editor</h2>

    <svg id="plan" viewBox="0 0 20 35" width="300"></svg>

    <div id="roomInfo">
        <h3>Room Details</h3>
        <table border="1">
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Width</th>
                    <th>Length</th>
                    <th>Area</th>
                </tr>
            </thead>
            <tbody id="roomRows"></tbody>
        </table>

        <h3>Total Room Area: <span id="totalRoomArea">0</span> sq ft</h3>
    </div>

    <script src="house.js"></script>
    <script src="draw.js"></script>
</body>
</html>
